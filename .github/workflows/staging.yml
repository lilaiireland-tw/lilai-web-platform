name: Cloudflare staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    # Opt-in stays off until origins, token, Access and runtime QA are ready.
    if: github.ref == 'refs/heads/develop' && vars.CLOUDFLARE_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      SITE_DEPLOYMENT_ENV: staging
      EVENT_DEPLOYMENT_ENV: preview
      EVENTS_INCLUDE_DRAFTS: 'false'
      WORDPRESS_ORIGIN: ${{ vars.STAGING_WORDPRESS_ORIGIN }}
      WORDPRESS_API_BASE: ${{ vars.STAGING_WORDPRESS_API_BASE }}
      WOOCOMMERCE_STORE_API_BASE: ${{ vars.STAGING_WOOCOMMERCE_STORE_API_BASE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run cf:typegen
      - run: npx tsc -p cloudflare/tsconfig.json
      - run: npx tsc --noEmit --incremental false
      - run: npm run check:staging
      - run: npx tsx scripts/check-deployment-policy.ts
      - run: npx tsx scripts/check-shared-layout.ts
      - run: npx tsx scripts/check-design-system.ts
      - run: npx tsx scripts/check-cloudflare-staging.ts
      - run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
