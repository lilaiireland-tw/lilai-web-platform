name: Cloudflare staging

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SITE_DEPLOYMENT_ENV: staging
      EVENT_DEPLOYMENT_ENV: preview
      EVENTS_INCLUDE_DRAFTS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run cf:typegen
      - run: npm run cf:typegen:router
      - run: npx tsc -p cloudflare/tsconfig.json
      - run: npx tsc --noEmit --incremental false
      - run: npm run check:staging
      - run: npx tsx scripts/check-production-release-strategy.ts
      - run: npx tsx scripts/check-deployment-policy.ts
      - run: npm run check:seo-url-consistency
      - run: npm run check:consult
      - run: npm run check:consent
      - run: npm run check:production-route-safety
      - run: npm run check:production-routing
      - run: npm run check:production-router
      - run: npm run cf:build:production-platform
      - run: npm run check:production-packaging
      - run: npx tsx scripts/check-shared-layout.ts
      - run: npx tsx scripts/check-design-system.ts
      - run: npx tsx scripts/check-cloudflare-staging.ts

  deploy:
    # Publication stays off until the placeholder Worker is Access-protected,
    # the token is configured and runtime QA is approved.
    needs: verify
    if: github.ref == 'refs/heads/develop' && vars.CLOUDFLARE_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: cloudflare-staging
      cancel-in-progress: false
    env:
      SITE_DEPLOYMENT_ENV: staging
      EVENT_DEPLOYMENT_ENV: preview
      EVENTS_INCLUDE_DRAFTS: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_CONFIRMED: ${{ vars.CLOUDFLARE_ACCESS_CONFIRMED }}
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
