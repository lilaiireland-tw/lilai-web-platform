name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: First cutover uses the audited legacy baseline; release requires a verified predecessor
        type: choice
        options: [release, first-cutover]
        default: release
      compatibility_approved:
        description: Reviewed adjacent Worker/API/assets and Queue payload compatibility, including rollback
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-production-release
  cancel-in-progress: false

jobs:
  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Production releases require main
        run: exit 1
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      SITE_DEPLOYMENT_ENV: production
      EVENT_DEPLOYMENT_ENV: production
      EVENTS_INCLUDE_DRAFTS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_MODE: ${{ inputs.mode }}
      COMPATIBILITY_APPROVED: ${{ inputs.compatibility_approved }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci
          node scripts/production/release.mjs ci
          npm run check:production-route-safety
          npm run cf:build:production-platform
          npm run check:production-packaging
          npm run audit:production-assets
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Preflight
        run: node scripts/production/release.mjs preflight
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Persist the verified recovery pair BEFORE the first version activation.
      - uses: actions/upload-artifact@v4
        with:
          name: production-evidence
          path: .cloudflare/release/before.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Deploy Platform
        run: node scripts/production/release.mjs platform
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Signup Backend
        run: node scripts/production/release.mjs backend
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify Production
        run: node scripts/production/release.mjs verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: production-verified
          path: .cloudflare/release/verified.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Preserve release results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-results
          path: .cloudflare/release/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
      - name: Release Summary
        if: always()
        run: node scripts/production/release.mjs summary
        env:
          RELEASE_RESULT: ${{ job.status }}
