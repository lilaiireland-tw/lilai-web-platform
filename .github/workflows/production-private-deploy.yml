name: Production validation

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SITE_DEPLOYMENT_ENV: production
      EVENT_DEPLOYMENT_ENV: production
      EVENTS_INCLUDE_DRAFTS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/production/*.test.mjs
      - run: npm run cf:typegen
      - run: npm run cf:typegen:router
      - run: npx tsc -p cloudflare/tsconfig.json
      - run: npx tsc --noEmit --incremental false
      - run: npm run check:staging
      - run: npx tsx scripts/check-production-release-strategy.ts
      - run: npx tsx scripts/check-deployment-policy.ts
      - run: npm run check:seo-url-consistency
      - run: npm run check:consult
      - run: npx tsx scripts/check-25plus8.ts
      - run: npm run check:consent
      - run: npx tsx scripts/check-consult-analytics.ts
      - run: npm run check:production-route-safety
      - run: npm run check:production-routing
      - run: npm run check:production-router
      - run: npm run check:production-integration
      - run: npm run cf:build:production-platform
      - run: npm run check:production-packaging
      - run: npm run audit:production-assets
      - run: npx tsx scripts/check-shared-layout.ts
      - run: npx tsx scripts/check-design-system.ts
      - run: npm run build
      - run: git diff --check
