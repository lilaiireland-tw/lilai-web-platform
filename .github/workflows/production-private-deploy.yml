name: Production private Workers (manual only)

on:
  workflow_dispatch:
    inputs:
      deploy_private_workers:
        description: Deploy both production Workers privately with no public routes
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SITE_DEPLOYMENT_ENV: production
      EVENT_DEPLOYMENT_ENV: production
      EVENTS_INCLUDE_DRAFTS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run cf:typegen
      - run: npm run cf:typegen:router
      - run: npx tsc -p cloudflare/tsconfig.json
      - run: npx tsc --noEmit --incremental false
      - run: npm run check:staging
      - run: npx tsx scripts/check-deployment-policy.ts
      - run: npm run check:production-routing
      - run: npm run check:production-router
      - run: npm run check:production-integration
      - run: npm run cf:build:production-platform
      - run: npm run check:production-packaging
      - run: npm run audit:production-assets
      - run: npx tsx scripts/check-shared-layout.ts
      - run: npx tsx scripts/check-design-system.ts
      - run: npm run build
      - run: git diff --check

  deploy-private:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_private_workers == true
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cloudflare-production-private
      cancel-in-progress: false
    env:
      SITE_DEPLOYMENT_ENV: production
      EVENT_DEPLOYMENT_ENV: production
      EVENTS_INCLUDE_DRAFTS: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run cf:build:production-platform
      - run: npm run cf:deploy:production-private -- --confirm-private-production-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
